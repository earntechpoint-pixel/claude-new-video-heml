services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - '8080:8080'
    init: true # reaps zombie Chromium processes
    shm_size: 1gb # Chromium needs a larger /dev/shm
    environment:
      PORT: '8080'
      RENDER_WORKERS: '2'
      MAX_CONCURRENT_JOBS: '1'
      FRAME_TIMEOUT_MS: '15000'
      JOB_TIMEOUT_MS: '1800000'
      JOB_TTL_MS: '3600000'
      CORS_ORIGIN: '*' # set to your frontend origin(s) in production
      # Chromium's own sandbox needs user namespaces / a custom seccomp profile. Here the *container* is
      # the sandbox (non-root, all caps dropped, read-only rootfs, no network egress rules needed because
      # the page itself is blocked from the network). Set to "true" if you run with Playwright's seccomp profile.
      CHROMIUM_SANDBOX: 'false'
    # Resource limits
    mem_limit: 4g
    cpus: 2
    pids_limit: 512
    # Hardening
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp/jobs:size=4g,uid=1000,gid=1000
      - /tmp:size=512m,uid=1000,gid=1000
      - /home/pwuser:size=256m,uid=1000,gid=1000
    restart: unless-stopped
